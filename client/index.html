<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script>
      /* Keep in sync with client/lib/device.ts classifyDevice — first paint on Fly. */
      (function () {
        try {
          var shortSide = Math.min(screen.width, screen.height);
          var coarse = window.matchMedia("(pointer: coarse)").matches;
          var fine = window.matchMedia("(pointer: fine)").matches;
          var hover = window.matchMedia("(hover: hover)").matches;
          var touch = (navigator.maxTouchPoints || 0) > 0 || coarse;
          var device = shortSide < 600 ? "phone" : touch ? "tablet" : hover && fine ? "desktop" : "tablet";
          var orientation = window.matchMedia("(orientation: landscape)").matches
            ? "landscape"
            : "portrait";
          document.documentElement.setAttribute("data-device", device);
          document.documentElement.setAttribute("data-orientation", orientation);
        } catch (e) {}
      })();
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0b3a29" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="3-13" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="description" content="Three Thirteen for family play. Share a room code. No accounts." />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png" />
    <title>Three Thirteen</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700;9..144,800&family=Source+Sans+3:wght@400;600;700;800&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/main.tsx"></script>
  </body>
</html>
